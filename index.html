<body>

  <main>
    <h1>LaTeX Accessibility Checker</h1>

    <p>
      Upload an Overleaf or LaTeX project ZIP to check its
      accessibility configuration.
    </p>

    <p>
      Your files are processed locally in your browser and are not uploaded.
    </p>

    <section>
      <h2>Upload Project</h2>

      <input
        type="file"
        id="zipFile"
        accept=".zip"
      >

      <input
  type="file"
  id="zipFile"
  accept=".zip"
>

<div id="mainDocumentArea" hidden>
  <label for="mainDocumentSelect">
    Main document:
  </label>

  <select id="mainDocumentSelect"></select>
</div>

<button id="checkButton">
  Check Project
</button>

<button id="fixButton" disabled>
  Create Accessible Copy
</button>
      
      <button id="checkButton">
        Check Project
      </button>

      <button id="fixButton" disabled>
  Create Accessible Copy
</button>
      
    </section>

    <section>

  </main>

<!-- JSZip lets us inspect ZIP files entirely in the browser -->
